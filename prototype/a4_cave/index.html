<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 A4 동굴</title>
<link rel="stylesheet" href="../common/proto.css">
<style>
  .card ul { font-size: 13px; }
  .wrap { position: relative; margin-top: 8px; user-select: none; }
  .wrap.painting { touch-action: none; }
  .board { display: grid; grid-template-columns: repeat(5, 1fr); border: 2px solid var(--line); }
  .board > div { outline: 1px dashed #ffffff26; outline-offset: -1px; flex-direction: column; } /* 칸 구분 옅은 점선, 글자는 세로로 쌓기 */
  .board > div { aspect-ratio: 1; position: relative; display: flex; align-items: center; justify-content: center;
    font-size: 12px; text-align: center; line-height: 1.2; cursor: pointer; border: 2px solid transparent; }
  .board .yard { background: #4a4234; color: #b8a888; font-size: 11px; cursor: default; }
  .board .rock { background: #17151b; background-image: radial-gradient(#25222b 1px, transparent 1px); background-size: 9px 9px; }
  /* 통로: 바위 위에 이어진 쪽으로만 뻗은 좁은 길 (방은 칸을 꽉 채운 네모) */
  .board .tunnel { background: #17151b; background-image: radial-gradient(#25222b 1px, transparent 1px); background-size: 9px 9px; cursor: default; border: 0; }
  .board .tunnel i { position: absolute; background: #6a6175; }
  .board .tunnel .tc { left: 32%; top: 32%; width: 36%; height: 36%; }
  .board .tunnel .up { left: 32%; top: 0; width: 36%; height: 34%; } .board .tunnel .down { left: 32%; bottom: 0; width: 36%; height: 34%; }
  .board .tunnel .left { top: 32%; left: 0; height: 36%; width: 34%; } .board .tunnel .right { top: 32%; right: 0; height: 36%; width: 34%; }
  .board .trap { background: #5a3a22; } .board .unit { background: #22405a; }
  .board .maze { background: #2e4a2a; } .board .boss { background: #5a2238; }
  .board .entry { background: #2c5a3a; color: #bfe8c9; font-weight: bold; }
  .board .goldc { background: #6b5a1e; color: #f6e6a6; font-weight: bold; }
  .board .sel { box-shadow: inset 0 0 0 3px #fff; }
  .board .pv { box-shadow: inset 0 0 0 3px var(--ok); } .board .pv.bad { box-shadow: inset 0 0 0 3px var(--no); }
  .board .route::before { content: ''; position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #f0d34a; z-index: 1; }
  .board .inv { box-shadow: inset 0 0 0 3px #f0d34a; }
  .board .inv::after { content: attr(data-n); position: absolute; right: 2px; bottom: 2px; background: #f0d34a; color: #000;
    font-weight: bold; font-size: 11px; padding: 0 3px; border-radius: 3px; }
  .board .inv.flee::after { background: #d9594c; color: #fff; }
  .board .offroute { filter: saturate(.35) brightness(.8); }
  .board small.off { color: #ffb4a8; font-size: 10px; }
  .board .route:not(.tunnel)::before { top: 6px; right: 6px; } /* 방 안의 길 점은 귀퉁이에 (방 이름과 안 겹치게) */
  .piece.maze { color: #a6d65a; } .piece.boss { color: #ff7aa8; }
  .door, .spot { position: absolute; transform: translate(-50%, -50%); border-radius: 3px; z-index: 2; }
  .door { background: #c58b3c; border: 2px solid #f3c77a; cursor: grab; touch-action: none; }
  .door.h { width: 26px; height: 10px; } .door.v { width: 10px; height: 26px; }
  .door::before { content: ''; position: absolute; inset: -10px; } /* 누르기 쉽게 */
  .door.moving { opacity: .35; }
  .slot { position: absolute; transform: translate(-50%, -50%); z-index: 2; border: 2px dashed #f3c77aaa; background: #f3c77a22; border-radius: 3px; cursor: pointer; }
  .slot.h { width: 24px; height: 9px; } .slot.v { width: 9px; height: 24px; }
  .slot::before { content: ''; position: absolute; inset: -10px; }
  .board .painted { box-shadow: inset 0 0 0 3px #a6d65a; }
  .spot { width: 22px; height: 22px; border-radius: 50%; border: 2px dashed #a6d65a; background: #a6d65a33; pointer-events: none; }
  .spot.near { background: #a6d65a; }
  .selbar { display: flex; gap: 6px; align-items: center; margin-top: 6px; font-size: 13px; min-height: 36px; }
  .selbar span { flex: 1; color: var(--dim); }
  .selbar button, .tools button, .modal button { font: inherit; border-radius: 6px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); cursor: pointer; padding: 8px 10px; }
  .tools { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; margin-top: 4px; }
  .tools button { padding: 6px 2px; font-size: 13px; display: flex; flex-direction: column; align-items: center; }
  .tools button span { font-size: 10px; color: var(--dim); }
  .tools button.on { border-color: var(--text); background: #3a3546; }
  .runbar { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); margin-top: 6px; min-height: 16px; }
  .speed button.on { border-color: var(--text); }
  .modalbg { position: fixed; inset: 0; background: #000a; display: flex; align-items: flex-end; justify-content: center; }
  .modalbg.hidden { display: none; }
  .modal { width: 100%; max-width: 390px; background: var(--panel); border-radius: 12px 12px 0 0; padding: 12px 14px 16px; }
  .modal h3 { margin: 0 0 8px; font-size: 15px; }
  .modal .lbl { color: var(--dim); font-size: 12px; margin: 10px 0 4px; }
  .modal .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .modal .row button { flex: 1; min-width: 30%; font-size: 13px; }
  .modal .row button small { display: block; color: var(--dim); font-size: 11px; }
  .modal button.on { border-color: var(--text); background: #3a3546; }
  .modal button.poor { opacity: .45; } .modal small.lack { color: var(--no); }
  .modal .stepper button { flex: 0 0 48px; min-width: 0; font-size: 18px; }
  .modal .stepper b { flex: 1; text-align: center; font-size: 16px; }
  .modal .note { font-size: 11px; color: var(--dim); margin-top: 4px; }
  .modal .foot { display: flex; gap: 6px; margin-top: 12px; }
  .modal .foot button { flex: 1; font-weight: bold; }
  .modal .foot .primary { background: #7a3fb0; border-color: #9a5fd0; }
  .modal .foot .danger { border-color: var(--no); color: var(--no); }
</style>
</head>
<body>
<script src="../common/rules.js"></script>
<script src="a4.js"></script>
<script>
var S = { sel: [], tool: null, speed: 1, pv: null, M: null, drag: null };
var run = null;
var TOOLS = [
  { k: 'maze', label: '미로', sub: '3×3 끌어 놓기' }, { k: 'boss', label: '보스방', sub: '2×2 끌어 놓기' }
];
var CATS = { trap: ['spike', 'rock'], unit: ['gob', 'skel', 'orc'] };

function el(id) { return document.getElementById(id); }
function toast(msg) {
  var r = el('result'); r.className = 'result toast'; r.textContent = msg;
  clearTimeout(toast.t); toast.t = setTimeout(function () { if (r.classList.contains('toast')) r.className = 'result hidden'; }, 1600);
}

function buildPage() {
  document.body.innerHTML =
    '<header><h1>시안 A4 동굴</h1><a href="../index.html">시안 목록 →</a></header>' +
    '<section class="card" id="demand"></section>' +
    '<p class="rule"><b>칸 고르기</b>: 누르기 또는 쓸기(최대 ' + A4.maxRoom + '칸) → 종류 고르면 방 완성. <b>길게 누른 뒤 끌기</b>: 바위는 통로로 파고, 통로는 바위로 메워요. ' +
    '<b>문</b>: 방 벽의 옅은 칸을 누르면 생기고, 문을 누르면 없어지고, 끌면 옮겨져요. 노란 점은 침입자가 올 가장 짧은 길, 그 길에 없는 방은 흐리게 <b>안 지나감</b>.</p>' +
    '<div class="wrap" id="wrap"><div id="board" class="board"></div><div id="over"></div></div>' +
    '<div class="selbar" id="selbar"></div>' +
    '<div class="tools" id="tools"></div>' +
    '<div class="runbar" id="runbar"></div>' +
    '<div class="buttons"><button id="go" class="primary">침입 시작</button><button id="ten">10번 시험</button><button id="clear">처음으로</button></div>' +
    '<div class="buttons speed" id="speed"></div>' +
    '<ol class="log" id="log"></ol>' +
    '<div class="modalbg hidden" id="modalbg"><div class="modal" id="modal"></div></div>' +
    '<div class="result hidden" id="result"></div>';
  el('tools').innerHTML = TOOLS.map(function (t) { return '<button data-k="' + t.k + '">' + t.label + '<span>' + t.sub + '</span></button>'; }).join('');
  el('tools').onclick = function (e) {
    var b = e.target.closest('button'); if (!b || run) return;
    S.tool = S.tool === b.dataset.k ? null : b.dataset.k; S.sel = []; draw();
  };
  el('speed').innerHTML = A4.speeds.map(function (s, i) { return '<button data-i="' + i + '">속도 ' + s.label + '</button>'; }).join('');
  el('speed').onclick = function (e) { var b = e.target.closest('button'); if (b) { S.speed = +b.dataset.i; draw(); } };
  el('go').onclick = startRun;
  el('ten').onclick = tenRuns;
  el('clear').onclick = function () { if (!run) { resetBoard(); S.sel = []; el('log').innerHTML = ''; draw(); } };
  el('modalbg').onclick = function (e) { if (e.target.id === 'modalbg') closeModal(); };
  bindBoard();
}

// ---------- 그리기 ----------
function cellAt(e) {
  var t = document.elementFromPoint(e.clientX, e.clientY), d = t && t.closest('#board [data-r]');
  return d ? [+d.dataset.r, +d.dataset.c] : null;
}
function stampCells(k, cell) {
  var sz = A4.extra[k].size, top = cell[0] - Math.floor((sz[0] - 1) / 2), left = cell[1] - Math.floor((sz[1] - 1) / 2), out = [];
  for (var r = 0; r < sz[0]; r++) for (var c = 0; c < sz[1]; c++) out.push([top + r, left + c]);
  return out;
}
function edgePos(a, b) { // 변의 가운데 (판 기준 %)
  return { x: ((a[1] + b[1]) / 2 + 0.5) / A4.cols * 100, y: ((a[0] + b[0]) / 2 + 0.5) / A4.rows * 100, h: a[1] === b[1] };
}
function drawBoard() {
  var f = run ? run.res.frames[Math.max(run.i - 1, 0)] : null, h = '', first = {}, onRoute = {};
  Object.keys(B.pieces).forEach(function (id) { var c = B.pieces[id].cells[0]; first[key(c)] = id; });
  var visited = {}; // 침입자 길(가장 짧은 길)에 있는 방
  if (!run) route().forEach(function (x) { onRoute[key(x)] = true; if (ownerAt(x)) visited[ownerAt(x)] = true; });
  for (var r = 0; r < A4.rows; r++) for (var c = 0; c < A4.cols; c++) {
    var cell = [r, c], p = pieceAt(cell), g = groundAt(cell), cls, label = '';
    if (g === 'entry') { cls = 'entry'; label = '입구<br><small>집결지</small>'; }
    else if (g === 'yard') { cls = 'yard'; label = c === 0 ? '공터' : ''; }
    else if (g === 'gold') { cls = 'goldc'; label = '보물방'; }
    else if (!p) {
      cls = g;
      if (g === 'tunnel') label = '<i class="tc"></i>' + DIRS.map(function (d) {
        return canPass(cell, [r + d.dr, c + d.dc]) ? '<i class="' + d.k + '"></i>' : '';
      }).join('');
    }
    else {
      var it = itemOf(p.content);
      cls = it.kind;
      if (first[key(cell)] === p.id) {
        label = '<span class="piece ' + it.kind + '">' + it.short + '</span>';
        if (it.kind === 'unit' || it.kind === 'boss') label += '<br>' + (f ? f.rooms[p.id] : (it.kind === 'boss' ? 1 : p.cells.length)) + '/' + (it.kind === 'boss' ? 1 : p.cells.length);
        else if (it.kind === 'trap') label += '<br>×' + p.cells.length;
        if (!run && !visited[p.id]) label += '<br><small class="off">안 지나감</small>';
      }
      if (!run && !visited[p.id]) cls += ' offroute';
    }
    // 같은 방 칸끼리는 테두리 없이, 방 바깥 변은 밝은 선
    var style = '';
    if (p) style = DIRS.map(function (d) {
      var n = [r + d.dr, c + d.dc], side = { up: 'top', down: 'bottom', left: 'left', right: 'right' }[d.k];
      return inB(n[0], n[1]) && ownerAt(n) === p.id ? '' : 'border-' + side + '-color:#cfc8da;';
    }).join('');
    if (S.sel.some(function (x) { return same(x, cell); })) cls += ' sel';
    if (S.pv && S.pv.cells.some(function (x) { return same(x, cell); })) cls += ' pv' + (S.pv.bad ? ' bad' : '');
    if (onRoute[key(cell)] && g !== 'entry' && g !== 'gold') cls += ' route';
    var n = '';
    if (f && same(f.cell, cell)) { cls += ' inv' + (f.mode === 'flee' ? ' flee' : ''); n = ' data-n="' + f.alive + '명"'; }
    h += '<div class="' + cls + '" data-r="' + r + '" data-c="' + c + '" style="' + style + '"' + n + '>' + label + '</div>';
  }
  el('board').innerHTML = h;
  // 문과 옮길 자리
  var o = '';
  Object.keys(B.doors).forEach(function (k) {
    var e = B.doors[k], pos = edgePos(e[0], e[1]);
    o += '<div class="door ' + (pos.h ? 'h' : 'v') + (S.drag && S.drag.k === k ? ' moving' : '') + '" data-door="' + k + '" style="left:' + pos.x + '%;top:' + pos.y + '%"></div>';
  });
  if (!run && !S.drag && !S.tool) doorSlots().forEach(function (s) {
    var pos = edgePos(s.inner, s.outer);
    o += '<div class="slot ' + (pos.h ? 'h' : 'v') + '" data-slot="' + s.k + '" style="left:' + pos.x + '%;top:' + pos.y + '%"></div>';
  });
  if (S.drag) S.drag.targets.forEach(function (s, i) {
    var pos = edgePos(s.inner, s.outer);
    o += '<div class="spot' + (S.drag.near === i ? ' near' : '') + '" style="left:' + pos.x + '%;top:' + pos.y + '%"></div>';
  });
  el('over').innerHTML = o;
  el('wrap').classList.toggle('painting', !run);
}
function drawDemand() {
  var s = summary(), d = PROTO.demand;
  function row(ok, label, val) { return '<li class="' + (ok ? 'ok' : 'no') + '">' + (ok ? '✔' : '✘') + ' ' + label + ' <b>' + val + '</b></li>'; }
  el('demand').innerHTML = '<div class="want">마왕의 요구: ' + d.text + '</div><ul>' +
    row(s.ratioOk, '함정 비율', Math.round(s.ratio * 100) + '% (함정 ' + s.traps + ' / 몬스터 ' + s.units + ')') +
    row(s.valueOk, '가치', s.value + ' / ' + d.minValue) + row(s.budgetOk, '금화', s.cost + ' / ' + A4.budget) + '</ul>' +
    '<div class="enemy">침입자: ' + A4.party.name + ' ' + A4.party.count + '명 (각 체력 ' + A4.party.hp + ' · 공격 ' + A4.party.atk + ') · 보급 ' + A4.supplies + '초</div>';
}
function drawSelbar() {
  var left = A4.budget - summary().cost, n = S.sel.length;
  function range(ids) { var c = ids.map(function (k) { return PROTO.items[k].cost * n; }); return Math.min.apply(null, c) + '~' + Math.max.apply(null, c); }
  el('selbar').innerHTML = n ? '<span>' + n + '칸 · 남은 금 <b>' + left + '</b><br>함정 ' + range(CATS.trap) + ' · 몬스터 ' + range(CATS.unit) + '</span><button id="mk" class="primary">방 만들기</button><button id="cancel">취소</button>'
    : S.paint ? '<span>' + (S.paint === 'dig' ? '통로 파는 중' : '통로 메우는 중') + ' (손을 떼면 끝)</span>'
    : S.tool ? '<span>' + TOOLS.filter(function (t) { return t.k === S.tool; })[0].label + ': 판 위에서 끌어 놓기 (도구를 다시 누르면 끝)</span>' : '<span>남은 금 <b>' + left + '</b></span>';
  if (el('mk')) { el('mk').onclick = function () { openModal(null); }; el('cancel').onclick = function () { S.sel = []; draw(); }; }
}
function drawRunbar() {
  var f = run ? run.res.frames[Math.max(run.i - 1, 0)] : null;
  el('runbar').innerHTML = f ? '<span>침입자 ' + f.alive + '명 · 체력 ' + f.hp.map(function (x) { return Math.max(x, 0); }).join('/') + '</span><span>보급 ' + f.sup + '초' + (f.mode === 'flee' ? ' · 도주 중' : '') + '</span>' : '';
}
function draw() {
  drawDemand(); drawBoard(); drawSelbar(); drawRunbar();
  document.querySelectorAll('#tools button').forEach(function (b) { b.classList.toggle('on', b.dataset.k === S.tool); });
  document.querySelectorAll('#speed button').forEach(function (b) { b.classList.toggle('on', +b.dataset.i === S.speed); });
  document.body.classList.toggle('running', !!run);
}

// ---------- 조작 ----------
function bindBoard() {
  var w = el('wrap'), g = null, LONG = 350; // g: 지금 손가락 동작 (press 누름 / swipe 쓸기 / paint 파기·메우기 / stamp 특수 방 / slot 문 자리)
  w.addEventListener('pointerdown', function (e) {
    if (run) return;
    var dn = e.target.closest('[data-door]'), sl = e.target.closest('[data-slot]');
    if (dn && !S.tool) { // 문: 누르면 없애기, 끌면 옮기기
      var k = dn.dataset.door, d = B.doors[k], id = ownerAt(d[0]) || ownerAt(d[1]);
      S.drag = { k: k, id: id, targets: moveTargets(id, k), near: -1, x: e.clientX, y: e.clientY };
      w.setPointerCapture(e.pointerId); e.preventDefault();
      draw(); return;
    }
    if (sl && !S.tool) { g = { kind: 'slot', k: sl.dataset.slot }; w.setPointerCapture(e.pointerId); e.preventDefault(); return; }
    var cell = cellAt(e); if (!cell) return;
    e.preventDefault(); w.setPointerCapture(e.pointerId);
    if (S.tool) { g = { kind: 'stamp' }; stampAt(cell); return; }
    var mine = g = { kind: 'press', start: cell };
    mine.timer = setTimeout(function () { // 길게 누르기 → 바위는 파기, 통로는 메우기
      if (g !== mine || mine.kind !== 'press' || pieceAt(cell)) return;
      var gr = groundAt(cell); if (gr !== 'rock' && gr !== 'tunnel') return;
      mine.kind = 'paint'; S.paint = gr === 'rock' ? 'dig' : 'fill'; S.sel = [];
      paintAt(cell);
    }, LONG);
  });
  w.addEventListener('pointermove', function (e) {
    if (S.drag) { S.drag.near = nearest(e); draw(); return; }
    if (!g) return;
    var cell = cellAt(e); if (!cell) return;
    if (g.kind === 'press' && !same(cell, g.start)) { // 길게 누르기 전에 움직이면 쓸기
      clearTimeout(g.timer);
      if (!buildable(g.start)) { g = null; return; }
      g.kind = 'swipe'; S.sel = [g.start];
    }
    if (g.kind === 'swipe') addSel(cell, true);
    else if (g.kind === 'paint') paintAt(cell);
    else if (g.kind === 'stamp') stampAt(cell);
  });
  w.addEventListener('pointerup', function (e) {
    if (S.drag) {
      var i = nearest(e), tap = Math.hypot(e.clientX - S.drag.x, e.clientY - S.drag.y) < 8;
      if (tap) { var err = closeDoor(S.drag.k); toast(err || '문을 없앴어요'); }
      else if (i >= 0) moveDoor(S.drag.id, S.drag.k, S.drag.targets[i]);
      else if (!S.drag.targets.length) toast('옮길 수 있는 자리가 없어요 (길이 끊기는 자리는 빠짐)');
      S.drag = null; draw(); return;
    }
    if (!g) return;
    var k = g; g = null; clearTimeout(k.timer);
    if (k.kind === 'slot') {
      var s = doorSlots().filter(function (x) { return x.k === k.k; })[0];
      var e2 = s ? openDoor(s.inner, s.outer) : '여기에는 문을 낼 수 없어요';
      if (e2) toast(e2);
    } else if (k.kind === 'press') tapCell(k.start);
    else if (k.kind === 'swipe') { draw(); if (S.sel.length) openModal(null); return; }
    else if (k.kind === 'paint') S.paint = null;
    else if (k.kind === 'stamp' && S.pv) { var e3 = S.pv.bad || place(S.pv.cells, S.tool); S.pv = null; if (e3) toast(e3); }
    draw();
  });
  function tapCell(cell) {
    var p = pieceAt(cell);
    if (p) return openModal(p.id);
    if (!buildable(cell)) return;
    var i = S.sel.findIndex(function (x) { return same(x, cell); });
    if (i >= 0) S.sel.splice(i, 1); else addSel(cell, false);
  }
  function addSel(cell, quiet) {
    var msg = null;
    if (S.sel.some(function (x) { return same(x, cell); })) return;
    if (!buildable(cell)) return;
    if (S.sel.length >= A4.maxRoom) msg = '방은 최대 ' + A4.maxRoom + '칸이에요';
    else if (S.sel.length && !S.sel.some(function (x) { return Math.abs(x[0] - cell[0]) + Math.abs(x[1] - cell[1]) === 1; })) msg = '고른 칸과 붙은 칸만 고를 수 있어요';
    else S.sel.push(cell);
    if (msg && !quiet) toast(msg);
    draw();
  }
  function nearest(e) { // 손가락에서 가장 가까운 후보 (판 칸 크기 0.6배 안)
    var rect = el('board').getBoundingClientRect(), cw = rect.width / A4.cols, best = -1, bd = cw * 0.6;
    S.drag.targets.forEach(function (s, i) {
      var p = edgePos(s.inner, s.outer), x = rect.left + p.x / 100 * rect.width, y = rect.top + p.y / 100 * rect.height;
      var dd = Math.hypot(x - e.clientX, y - e.clientY);
      if (dd < bd) { bd = dd; best = i; }
    });
    return best;
  }
  function paintAt(cell) { var err = digFill(cell, S.paint); if (err) toast(err); draw(); }
  function stampAt(cell) {
    var cells = stampCells(S.tool, cell);
    S.pv = { cells: cells, bad: cells.every(buildable) ? null : '그 자리에는 못 놓아요' };
    draw();
  }
}

// ---------- 방 팝업 ----------
function openModal(id) {
  var p = id ? B.pieces[id] : null, kind = p ? itemOf(p.content).kind : null;
  if (!p && !contiguous(S.sel)) { toast('고른 칸이 서로 이어져야 해요'); return; }
  S.M = { id: id, n: p ? p.cells.length : S.sel.length, content: p ? p.content : null,
    cat: kind === 'trap' || kind === 'unit' ? kind : null, special: !!p && !(kind === 'trap' || kind === 'unit'),
  };
  drawModal();
  el('modalbg').className = 'modalbg';
}
function closeModal() { S.M = null; el('modalbg').className = 'modalbg hidden'; }
function drawModal() {
  var M = S.M, h = '<h3>' + (M.id ? itemOf(M.content).name + ' 고치기' : M.n + '칸 방 만들기') + '</h3>';
  if (!M.special) {
    h += '<div class="lbl">① 종류</div><div class="row">' +
      '<button data-cat="trap" class="' + (M.cat === 'trap' ? 'on' : '') + '">함정 방<small>칸마다 함정 1개</small></button>' +
      '<button data-cat="unit" class="' + (M.cat === 'unit' ? 'on' : '') + '">몬스터 방<small>칸마다 부대 1개</small></button></div>';
    if (M.cat) {
      h += '<div class="lbl">② ' + (M.cat === 'trap' ? '함정' : '몬스터') + ' 고르기 (' + M.n + '칸)</div><div class="row">';
      var left = A4.budget - summary().cost + (M.id ? pieceCost(M.content, M.n) : 0); // 고칠 때는 지금 방 값을 돌려받는 셈
      CATS[M.cat].forEach(function (k) {
        var it = PROTO.items[k], stat = it.kind === 'trap' ? '피해 ' + it.dmg : '체력 ' + it.hp + ' 공격 ' + it.atk, cost = it.cost * M.n;
        h += '<button data-ct="' + k + '" class="' + (M.content === k ? 'on' : '') + (cost > left ? ' poor' : '') + '">' + it.short + '<small>' + stat + '</small><small>금 ' + cost + ' · 가치 ' + it.value * M.n + '</small>' + (cost > left ? '<small class="lack">금 ' + (cost - left) + ' 모자람</small>' : '') + '</button>';
      });
      h += '</div>';
    }
  }
  if (M.id) {
    var dn = doorsOf(M.id).length;
    h += '<div class="note">문 ' + dn + '개 (최대 ' + A4.maxDoors + '개). 방 벽의 옅은 칸을 <b>누르면 문이 생기고</b>, 문을 <b>누르면 없어지고</b>, <b>끌면 옮겨져요</b>. ' +
      '문이 적을수록 침입자를 원하는 방향으로 묶어 둘 수 있지만 침입자에게 유리한 효과가 생겨요 (효과는 아직 미정).</div>';
    h += '<div class="foot"><button class="danger" id="del">허물기</button><button id="no">닫기</button></div>';
  } else h += '<div class="foot"><button id="no">취소</button></div>';
  el('modal').innerHTML = h;
  el('modal').onclick = function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.cat) { M.cat = b.dataset.cat; if (!M.content || itemOf(M.content).kind !== M.cat) M.content = null; }
    else if (b.dataset.ct) { // 세부 종류를 고르면 바로 만들기·바꾸기
      var err = M.id ? editPiece(M.id, b.dataset.ct) : place(S.sel.slice(), b.dataset.ct);
      if (err) return toast(err);
      S.sel = []; closeModal(); return draw();
    }
    else if (b.id === 'no') return closeModal();
    else if (b.id === 'del') { removePiece(M.id); closeModal(); return draw(); }
    drawModal();
  };
}

// ---------- 침입 ----------
var OUT = { wiped: '전멸시켰다!', fled: '쫓아냈다!', breach: '보물방이 뚫렸다…' };
function startRun() {
  if (run) return;
  S.sel = []; S.tool = null;
  run = { res: simulate((Math.random() * 1e9) | 0), i: 0 };
  el('log').innerHTML = '';
  step();
}
function addLog(f) { if (f.text) { el('log').insertAdjacentHTML('beforeend', '<li>' + f.text + '</li>'); el('log').lastChild.scrollIntoView({ block: 'nearest' }); } }
function step() {
  var res = run.res;
  if (run.i >= res.frames.length) return finish(res);
  var f = res.frames[run.i++], ms = A4.speeds[S.speed].ms;
  addLog(f);
  if (ms === 0) { while (run.i < res.frames.length) addLog(res.frames[run.i++]); draw(); return finish(res); }
  draw();
  run.timer = setTimeout(step, Math.max(f.cost, 0.3) * ms);
}
function finish(res) {
  var s = summary(), deliver = s.ok && res.outcome !== 'breach', r = el('result');
  r.className = 'result ' + (deliver ? 'win' : 'lose');
  r.innerHTML = '<h2>' + OUT[res.outcome] + '</h2>' +
    '<p>처치 <b>' + res.killed + '</b> · 도주 <b>' + res.fled + '</b> · 잃은 부대 <b>' + res.lostUnits + '</b></p>' +
    '<p>걸린 시간 <b>' + res.time + '초</b> · 가치 <b>' + s.value + '</b> · 함정 비율 <b>' + Math.round(s.ratio * 100) + '%</b></p>' +
    '<p class="verdict">' + (deliver ? '납품 가능!' : '납품 불가') + ' — ' + (!s.ok ? '요구를 못 맞췄어요' : res.outcome === 'breach' ? '보물방이 뚫렸어요' : '요구 충족 + 방어 성공') + '</p>' +
    '<button id="again" class="primary">다시 배치</button>';
  el('again').onclick = function () { r.className = 'result hidden'; run = null; draw(); };
}
function tenRuns() {
  if (run) return;
  var t = { wiped: 0, fled: 0, breach: 0 }, fledSum = 0, timeSum = 0;
  for (var k = 1; k <= 10; k++) { var res = simulate(k); t[res.outcome]++; fledSum += res.fled; timeSum += res.time; }
  el('log').innerHTML = '<li>10번 시험: 전멸 <b>' + t.wiped + '</b> · 쫓아냄 <b>' + t.fled + '</b>(도주 ' + fledSum + '명) · 뚫림 <b>' + t.breach + '</b> · 평균 ' + Math.round(timeSum / 10) + '초</li>';
}

resetBoard();
buildPage();
draw();
</script>
</body>
</html>
