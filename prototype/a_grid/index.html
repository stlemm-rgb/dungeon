<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 A 칸 단위</title>
<link rel="stylesheet" href="../common/proto.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
  .grid div { aspect-ratio: 1; border-radius: 4px; display: flex; align-items: center; justify-content: center;
    text-align: center; font-size: 11px; color: var(--dim); }
  .grid .wall { background: var(--wall); }
  .grid .path { background: var(--path); cursor: pointer; }
  .grid .gold { background: #6b5a1e; color: #f6e6a6; font-weight: bold; }
  .entry { color: var(--dim); font-size: 12px; margin-bottom: 2px; }
</style>
</head>
<body>
<script src="../common/rules.js"></script>
<script src="../common/ui.js"></script>
<script>
// 6칸 x 7줄 판. 짝수 줄은 통로, 홀수 줄은 끝 칸 하나로 이어지는 뱀 모양 길.
var COLS = 6, ROWS = 7, PATH = [];
(function () {
  for (var r = 0; r < ROWS; r++) {
    var ltr = (r % 4 === 0);
    if (r % 2 === 0) for (var k = 0; k < COLS; k++) PATH.push([r, ltr ? k : COLS - 1 - k]);
    else PATH.push([r, (r % 4 === 1) ? COLS - 1 : 0]);
  }
})();
var LAST = PATH.length - 1; // 마지막 칸 = 보물방 (놓을 수 없음)
var cells = PATH.map(function () { return null; }); // 길 순서대로 놓인 것
var ARROW = PATH.map(function (p, i) {
  if (i === LAST) return '';
  var n = PATH[i + 1];
  return n[0] > p[0] ? '↓' : n[1] > p[1] ? '→' : '←';
});

UI.init({
  title: '시안 A 칸 단위',
  other: { href: '../b_room/index.html', label: '방 단위 보기' },
  rule: '칸마다 하나씩 놓기. 모험가는 화살표 길을 따라 한 칸씩 걷는다. ' +
    '<b>함정 바로 다음 칸의 부대는 기습</b>(공격 ×1.5). 같은 걸 다시 누르면 빠진다.',
  placed: function () { return cells.filter(Boolean); },
  steps: function () {
    var steps = [];
    for (var i = 0; i <= LAST; i++) {
      var prev = i > 0 && cells[i - 1] && PROTO.items[cells[i - 1]].kind === 'trap';
      steps.push({ at: i, id: cells[i], ambush: !!prev });
    }
    return steps;
  },
  clear: function () { cells = cells.map(function () { return null; }); },
  render: function (board, invAt) {
    var map = {};
    PATH.forEach(function (p, i) { map[p[0] + ',' + p[1]] = i; });
    var html = '<div class="entry">입구 ↓</div><div class="grid">';
    for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) {
      var i = map[r + ',' + c];
      if (i === undefined) { html += '<div class="wall"></div>'; continue; }
      var cls = i === LAST ? 'gold' : 'path', inner;
      if (i === LAST) inner = '보물방';
      else if (cells[i]) inner = '<span class="piece ' + PROTO.items[cells[i]].kind + '">' + PROTO.items[cells[i]].short + '</span>';
      else inner = ARROW[i];
      if (i === invAt) cls += ' invader';
      html += '<div class="' + cls + '" data-i="' + i + '">' + inner + '</div>';
    }
    board.innerHTML = html + '</div>';
    board.onclick = function (e) {
      var d = e.target.closest('[data-i]');
      if (!d) return;
      var i = +d.getAttribute('data-i');
      if (i === LAST) return;
      cells[i] = UI.apply(cells[i]);
      UI.refresh();
    };
  }
});
</script>
</body>
</html>
